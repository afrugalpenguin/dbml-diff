name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history + tags so the release-notes fallback can diff against
          # the previous tag (git log <prev-tag>..<tag>).
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      # Trusted publishing (OIDC) needs a recent npm; no token required.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
      - name: Build release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the body of the "## [VERSION]" section, up to the next "## [" heading.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # If the CHANGELOG section is missing or blank (nothing but whitespace),
          # fall back to commit messages so the release never ships empty notes.
          if [ -z "$(sed '/^[[:space:]]*$/d' release-notes.md)" ]; then
            echo "::warning::No CHANGELOG section for $VERSION; generating notes from commits." >&2
            PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            {
              echo "_No CHANGELOG entry for this release; generated from commit messages._"
              echo
              if [ -n "$PREV_TAG" ]; then
                git log --no-merges --pretty='- %s' "${PREV_TAG}..${GITHUB_REF_NAME}"
              else
                git log --no-merges --pretty='- %s' "${GITHUB_REF_NAME}"
              fi
            } > release-notes.md
          fi
          {
            echo
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          } >> release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
