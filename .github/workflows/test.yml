name: test

on:
  # Scope push to main so a branch with an open PR isn't tested twice (once for
  # push, once for pull_request). Branch commits are covered via pull_request;
  # merges to main are covered here.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
